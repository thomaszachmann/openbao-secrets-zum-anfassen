apiVersion: v1
kind: Pod
metadata: {name: klartext, namespace: shop}
spec:
  containers:
  - name: app
    image: busybox:1.37
    env:
    - {name: DB_PASSWORD, value: lab-db-pw-123}
---
apiVersion: v1
kind: Pod
metadata: {name: sauber, namespace: shop}
spec:
  containers:
  - name: app
    image: busybox:1.37
    env:
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef: {name: shop-db, key: db_password}
    - {name: LOG_LEVEL, value: info}
