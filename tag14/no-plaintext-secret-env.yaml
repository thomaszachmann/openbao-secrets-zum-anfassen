apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: no-plaintext-secret-env
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
  validations:
  - expression: >-
      object.spec.containers.all(c, !has(c.env) || c.env.all(e,
        !e.name.matches('(?i)(password|secret|token|api_?key)') || !has(e.value)))
    message: "Secret-Variablen nie als value:, sondern per secretKeyRef oder Datei"
