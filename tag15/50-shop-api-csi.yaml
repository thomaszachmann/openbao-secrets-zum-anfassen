# Tag 15: CSI-Variante (wie Tag 6, Drill 3) als shop-api-csi
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api-csi
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: shop-api-csi}
  template:
    metadata:
      labels: {app: shop-api-csi}
    spec:
      terminationGracePeriodSeconds: 2
      serviceAccountName: shop-api
      containers:
        - name: app
          image: busybox:1.37
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: shop-api-bao
