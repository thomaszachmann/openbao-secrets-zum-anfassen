apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shop-api-gitops
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: openbao          # SecretStore aus Tag 3
  target:
    name: shop-api-gitops
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: shop/api
        property: db_password
