# Tag 4: PushSecret – K8s-Secret shop-webhook nach OpenBao secret/shop/webhook
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: shop-webhook
  namespace: shop
spec:
  refreshInterval: 1m
  deletionPolicy: Delete
  secretStoreRefs:
    - kind: SecretStore
      name: openbao-push
  selector:
    secret:
      name: shop-webhook
  data:
    - match:
        secretKey: signing_key
        remoteRef:
          remoteKey: shop/webhook
          property: signing_key
