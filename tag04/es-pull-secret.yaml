# Tag 4: Image-Pull-Secret (dockerconfigjson) aus OpenBao bauen
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shop-registry
  namespace: shop
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: shop-registry
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ .server }}":{"username":"{{ .username }}",
          "password":"{{ .password }}",
          "auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  dataFrom:
    - extract:
        key: shop/registry
