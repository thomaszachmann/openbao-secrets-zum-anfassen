# Tag 4: SecretStore im NS fremd – eigener ServiceAccount, fremde Rolle shop-api
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: fremd
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: shop-api
          serviceAccountRef:
            name: default
            audiences:
              - openbao
