# Tag 4 (Fehler 1): SecretStore ohne passende Audience
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kaputt-audience
  namespace: shop
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: shop-api
          serviceAccountRef:
            name: shop-api
