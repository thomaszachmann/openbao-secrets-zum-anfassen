# Tag 4: eigener SecretStore mit Schreibrolle für PushSecret
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-push
  namespace: shop
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: shop-pusher
          serviceAccountRef:
            name: shop-pusher
            audiences:
              - openbao
