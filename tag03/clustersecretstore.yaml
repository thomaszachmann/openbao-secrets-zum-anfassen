# Tag 3: ClusterSecretStore – clusterweit, ServiceAccount mit Namespace
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-shop
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: shop-api
          serviceAccountRef:
            name: shop-api
            namespace: shop
            audiences:
              - openbao
