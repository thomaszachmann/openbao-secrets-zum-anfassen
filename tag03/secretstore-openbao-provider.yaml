# Tag 3 (Variante): Provider openBao statt vault – nur lesend, Rolle braucht
# zusätzlich read auf sys/mounts/secret (Validierung)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-nativ
  namespace: shop
spec:
  provider:
    openBao:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          path: kubernetes
          role: shop-api
          serviceAccountRef:
            name: shop-api
            audiences:
              - openbao
