# Tag 7: cert-manager-Issuer (Typ vault) gegen OpenBao-PKI per Kubernetes-Auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-issuer
  namespace: shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shop-issuer-token
  namespace: shop
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["shop-issuer"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-shop-issuer-token
  namespace: shop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shop-issuer-token
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao
  namespace: shop
spec:
  vault:
    server: http://openbao.openbao.svc:8200
    path: pki/sign/shop-svc
    auth:
      kubernetes:
        role: cert-manager-shop
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: shop-issuer
          audiences: ["openbao"]
